name        = "BCB SGS Standard Pipelines"
description = "Pipelines de referência para o motor bcb-sgs-sql, cobrindo preços, juros, câmbio, atividade, crédito e agregados monetários."
version     = "0.1.0"

[[pipeline]]
id          = "precos"
description = "Índices de preços (IPCA, IPCA-15, INPC, IGP-M)"
path        = "precos"

[[pipeline]]
id          = "juros"
description = "Taxas de juros (SELIC meta/over, CDI, TR)"
path        = "juros"

[[pipeline]]
id          = "cambio"
description = "Taxas de câmbio (USD/BRL, EUR/BRL)"
path        = "cambio"

[[pipeline]]
id          = "atividade"
description = "Indicadores de atividade econômica (IBC-Br)"
path        = "atividade"

[[pipeline]]
id          = "credito"
description = "Operações de crédito (saldo total, inadimplência, spread)"
path        = "credito"

[[pipeline]]
id          = "monetario"
description = "Agregados monetários (M1, M2, M3, M4)"
path        = "monetario"

[[pipeline]]
id          = "alcool_carburante"
description = "Consumo de álcool carburante (hidratado, anidro, total)"
path        = "alcool_carburante"

[[pipeline]]
id          = "commodities"
description = "Índices de Commodities (IC-Br)"
path        = "commodities"

[[pipeline]]
id          = "derivados_petroleo"
description = "Produção e consumo de derivados de petróleo"
path        = "derivados_petroleo"

[[pipeline]]
id          = "desembolsos_bndes"
description = "Desembolsos do BNDES por setor"
path        = "desembolsos_bndes"

[[pipeline]]
id          = "energia_eletrica"
description = "Consumo de energia elétrica por setor"
path        = "energia_eletrica"

[[pipeline]]
id          = "movimento_cambio_contratado"
description = "Movimento de câmbio contratado"
path        = "movimento_cambio_contratado"

[[pipeline]]
id          = "pib_mensal"
description = "PIB mensal acumulado em 12 meses (BRL e USD)"
path        = "pib_mensal"

